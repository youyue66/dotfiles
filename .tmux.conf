# ~/.tmux.conf — tmux configuration

# General settings
set -g default-terminal "screen-256color"
set -s escape-time 10
set -sg repeat-time 600
set -s focus-events on

# History limit
set -g history-limit 10000

# Start window numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Rename windows
setw -g automatic-rename on
set -g renumber-windows on

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded"
\n# Split panes with | and -\nbind | split-window -h\nbind - split-window -v
\n# Set terminal title\nset -g set-titles on\nset -g set-titles-string "#S:#I:#W"
\n# Resize panes\nbind -r H resize-pane -L 5\nbind -r J resize-pane -D 5\nbind -r K resize-pane -U 5\nbind -r L resize-pane -R 5
